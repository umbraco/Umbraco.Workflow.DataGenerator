name: $(Date:yyyyMMdd).$(Rev:r)-$(Build.Reason)

trigger:
  batch: true
  branches:
    include:
    - main
    - v*/dev
  tags:
    include:
    - release-*

pr:
  branches:
    include:
    - main
    - v*/dev

resources:
  repositories:
  - repository: build
    type: github
    name: Umbraco/Umbraco.Build
    endpoint: umbraco

parameters:
  - name: prerelease
    displayName: Release to MyGet
    type: string
    default: auto
    values:
      - auto # Only release to MyGet on public releases, otherwise skip
      - prerelease # Release to MyGet pre-release feed, regardless of release type
      - nightly # Release to MyGet nightly feed, regardless of release type
      - skip # Skip releasing to MyGet, regardless of release type
  - name: release
    displayName: Release
    type: string
    default: auto
    values:
      - auto # Only release to NuGet/NPM on public releases, otherwise skip
      - public # Release to NuGet/NPM, regardless of release type
  # do we generate SBOM?
  - name: sbom_generate
    displayName: Generate SBOM
    type: boolean
    default: false

extends:
  template: devops/templates/azure-pipelines-template.yml@build
  parameters:
    product_name: "Umbraco.Workflow.DataGenerator"
    prerelease: ${{ parameters.prerelease }}
    release: ${{ parameters.release }}
    sbom_generate: ${{ parameters.sbom_generate }}
    sbom_dt_variable_group: dependency-track
